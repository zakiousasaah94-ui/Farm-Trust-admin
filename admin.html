<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Trust Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- ADMIN LOGIN SCREEN (Shows first) -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Admin Login</h1>
            <input type="password" id="admin-password" placeholder="Enter Admin Password" class="w-full mb-4 p-3 border rounded-lg focus:outline-green-500 text-center font-bold">
            <button onclick="checkPassword()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Login</button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">Incorrect Password</p>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD (Hidden until login) -->
    <div id="admin-dashboard" class="hidden">
        <nav class="bg-[#0f172a] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
            <div>
                <h1 class="text-xl font-bold tracking-wider">FARM TRUST</h1>
                <h1 class="text-lg font-bold tracking-wider text-gray-300">ADMIN</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-gray-800 rounded-full px-3 py-1 flex items-center gap-2 border border-gray-700">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-sm font-bold" id="total-users-badge">0</span>
                </div>
                <button onclick="logoutAdmin()" class="text-red-400 hover:text-red-300 flex flex-col items-center text-xs font-bold">
                    <i class="fas fa-power-off text-lg mb-1"></i> Logout
                </button>
            </div>
        </nav>

        <div class="max-w-3xl mx-auto p-4">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-bold mb-1 tracking-wider">TOTAL USERS</p>
                    <h2 class="text-3xl font-bold text-gray-800" id="stat-total-users">0</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 relative">
                    <p class="text-xs text-gray-500 font-bold mb-1 tracking-wider">ACTIVE MINING</p>
                    <h2 class="text-3xl font-bold text-blue-600" id="stat-active-investments">0</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-bold mb-1 tracking-wider">PENDING DEPOSITS</p>
                    <h2 class="text-3xl font-bold text-green-600" id="stat-pending-deposits">0</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-bold mb-1 tracking-wider">PENDING WITHDRAWALS</p>
                    <h2 class="text-3xl font-bold text-orange-500" id="stat-pending-withdrawals">0</h2>
                </div>
            </div>

            <!-- Total Approved -->
            <div class="bg-green-600 text-white p-4 rounded-2xl shadow-sm mb-8">
                <p class="text-xs font-bold tracking-wider mb-1 opacity-90">TOTAL APPROVED</p>
                <h2 class="text-3xl font-bold">GH₵ 0.00</h2>
            </div>

            <!-- Search -->
            <h2 class="text-sm font-bold text-gray-800 tracking-wider mb-3 flex items-center gap-2">
                <i class="fas fa-search text-orange-500"></i> SEARCH USER
            </h2>
            <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 flex mb-8">
                <input type="text" id="search-input" placeholder="Search by name, email, or phone..." class="flex-1 p-2 outline-none text-sm bg-transparent">
                <button onclick="searchUser()" class="bg-[#0f172a] text-white px-4 py-2 rounded-xl text-sm font-bold">Search</button>
            </div>

            <div id="search-results-container" class="hidden mb-8 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="p-3">User</th>
                            <th class="p-3 text-right">Balance</th>
                            <th class="p-3 text-center">Adjust</th>
                        </tr>
                    </thead>
                    <tbody id="search-results-body"></tbody>
                </table>
            </div>

            <!-- Action Queue -->
            <h2 class="text-sm font-bold text-gray-800 tracking-wider mb-3 flex items-center gap-2">
                <i class="fas fa-history text-orange-500"></i> ACTION QUEUE
            </h2>
            <div id="transactions-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        // SECURITY CHECK
        function checkPassword() {
            const pass = document.getElementById('admin-password').value;
            // THIS IS YOUR ADMIN PASSWORD. CHANGE IT IF YOU WANT.
            if (pass === 'admin123') { 
                localStorage.setItem('isAdmin', 'true');
                showDashboard();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            loadDashboard();
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdmin');
            window.location.reload();
        }

        // Check if already logged in
        if (localStorage.getItem('isAdmin') === 'true') {
            showDashboard();
        }

        // --- DASHBOARD LOGIC ---
        async function loadDashboard() {
            const usersRes = await fetch('/api/users');
            const users = await usersRes.json();
            document.getElementById('stat-total-users').innerText = users.length;
            document.getElementById('total-users-badge').innerText = users.length;

            const res = await fetch('/api/transactions/pending');
            const txns = await res.json();
            const list = document.getElementById('transactions-list');
            list.innerHTML = '';

            let pendingDeposits = 0;
            let pendingWithdrawals = 0;

            if (txns.length === 0) {
                list.innerHTML = '<div class="bg-white p-6 rounded-2xl shadow-sm text-center text-gray-500">No pending requests right now.</div>';
            } else {
                txns.forEach(txn => {
                    if (txn.type === 'deposit') pendingDeposits++;
                    if (txn.type === 'withdrawal') pendingWithdrawals++;

                    const isDeposit = txn.type === 'deposit';
                    const badgeClass = isDeposit ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                    const amountClass = isDeposit ? 'text-green-600' : 'text-orange-500';

                    list.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] font-bold px-2 py-1 rounded ${badgeClass}">${txn.type.toUpperCase()} REQUEST</span>
                                <span class="text-xl font-bold ${amountClass}">GH₵ ${txn.amount.toFixed(2)}</span>
                            </div>
                            <h3 class="font-bold text-gray-800 text-lg mb-3">${txn.username}</h3>
                            <div class="bg-gray-50 p-3 rounded-xl mb-4">
                                <p class="text-xs text-gray-500 font-bold mb-1">Details:</p>
                                <p class="text-sm text-gray-600">Paystack - Transaction Logged</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="handleAction('${txn._id}', 'approve')" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold shadow hover:bg-green-700">APPROVE</button>
                                <button onclick="handleAction('${txn._id}', 'reject')" class="flex-1 bg-red-100 text-red-600 py-3 rounded-xl font-bold hover:bg-red-200">REJECT</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('stat-pending-deposits').innerText = pendingDeposits;
            document.getElementById('stat-pending-withdrawals').innerText = pendingWithdrawals;
        }

        async function searchUser() {
            const query = document.getElementById('search-input').value;
            if (!query) return alert("Enter a name, email, or phone number");

            const res = await fetch('/api/admin/search-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const users = await res.json();
            
            const container = document.getElementById('search-results-container');
            const tbody = document.getElementById('search-results-body');
            tbody.innerHTML = '';
            container.classList.remove('hidden');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">No users found.</td></tr>';
                return;
            }

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr class="border-t">
                        <td class="p-3">
                            <p class="font-bold text-gray-800">${user.username}</p>
                            <p class="text-xs text-gray-500">${user.phone || 'No phone'} | ${user.email}</p>
                        </td>
                        <td class="p-3 text-right font-bold text-green-600">GH₵ ${user.balance.toFixed(2)}</td>
                        <td class="p-3 text-center flex justify-center gap-1 mt-2">
                            <button onclick="manualAdjust('${user._id}', 'add')" class="bg-green-500 text-white w-8 h-8 rounded-full font-bold shadow hover:bg-green-600">+</button>
                            <button onclick="manualAdjust('${user._id}', 'subtract')" class="bg-red-500 text-white w-8 h-8 rounded-full font-bold shadow hover:bg-red-600">-</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function manualAdjust(userId, action) {
            const amountStr = prompt(`Enter amount to ${action === 'add' ? 'ADD TO' : 'DEDUCT FROM'} user balance:`);
            if (!amountStr) return;
            const amount = parseFloat(amountStr);
            if (isNaN(amount) || amount <= 0) return alert("Please enter a valid number");

            const res = await fetch('/api/admin/adjust-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount, action })
            });
            
            if(res.ok) {
                alert("Balance updated!");
                searchUser(); 
            }
        }

        async function handleAction(transactionId, action) {
            const res = await fetch('/api/transactions/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transactionId, action })
            });
            
            if(res.ok) {
                loadDashboard();
            } else {
                const data = await res.json();
                alert("Error: " + data.error);
            }
        }
    </script>
</body>
</html>
